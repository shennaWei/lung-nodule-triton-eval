name: triton-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build & push Triton image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exported ONNX bundle
        env:
          MODELS_BUNDLE_URL: ${{ secrets.MODELS_BUNDLE_URL }}
        run: |
          if [ -z "${MODELS_BUNDLE_URL}" ]; then
            echo "MODELS_BUNDLE_URL secret is not configured" >&2
            exit 1
          fi
          curl -fsSL "${MODELS_BUNDLE_URL}" -o models.tar.gz
          tar -xzf models.tar.gz -C deploy/triton/model_repository
          find deploy/triton/model_repository -name '*.onnx' -printf '%p %s bytes\n'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/triton-nodule-pipeline
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/triton/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
